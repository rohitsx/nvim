bar {
    status_command ~/.config/i3/scripts/status_wrapper.sh
    font pango:Fira code 12

    # mode hide                  
    # hidden_state hide         
    # modifier Mod4            

    position bottom
    tray_output primary
    strip_workspace_numbers yes
    workspace_buttons yes


    tray_output none

colors {
    background         #1e1e22
    statusline         #d0d4dc
    separator          #3a3f4b

    focused_workspace  #4a6cf7 #4a6cf7 #ffffff
    active_workspace   #2a2f3a #2a2f3a #cfd3da
    inactive_workspace #1b1e26 #1b1e26 #8b90a0
    urgent_workspace   #e06c75 #e06c75 #ffffff
    binding_mode       #e5c07b #e5c07b #1e1e22
}


}


